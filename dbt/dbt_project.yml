name: 'retailflow'
version: '1.0.0'
config-version: 2

profile: 'retailflow'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  retailflow:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold