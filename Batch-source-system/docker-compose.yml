version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: source_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: source_pass
      POSTGRES_DB: ecommerce_source
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_admin -d ecommerce_source"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: source_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pg_data:
